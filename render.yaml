services:
  - type: web
    name: homebound
    runtime: node
    region: frankfurt
    plan: free
    # Builds take several minutes; deploy manually so every push doesn't spend build minutes
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: homebound-db
          property: connectionString
      - key: SEED_ON_START
        value: "true"
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Leave empty on first deploy; set after registering the webhook URL with PayPal
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SANDBOX_CONTRACTOR_EMAIL
        sync: false
      - key: SANDBOX_SUPPLIER_EMAIL
        sync: false
      - key: SANDBOX_INSPECTOR_EMAIL
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

# The payout reconcile schedule runs from .github/workflows/reconcile.yml (Render cron jobs have no free plan)

databases:
  # Free Render Postgres is deleted 30 days after creation; switch to 0.1c-256mb before then
  - name: homebound-db
    databaseName: homebound
    region: frankfurt
    plan: free
